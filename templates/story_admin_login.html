<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Store Admin | Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/story-admin-login.css') }}">
</head>
<body class="story-admin-login-body">

    <div class="login-card">
        <div class="login-brand">
            <span class="login-brand-icon">📚</span>
            <h1 class="login-title">Story Store Admin</h1>
            <p class="login-subtitle">Sign in to manage books, inventory & orders</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div style="margin-bottom:1.25rem;">
            {% for category, message in messages %}
            <div style="background:rgba(231,76,60,0.2); border:1px solid #e74c3c; color:#e74c3c; padding:.75rem; border-radius:.5rem; font-size:.85rem; text-align:center;">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form action="{{ url_for('story_admin_login') }}" method="post">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" placeholder="Enter admin username" required class="form-input" autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" placeholder="••••••••" required class="form-input">
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; font-size:.8rem; margin-bottom:1.25rem; color:#aaa;">
                <label style="display:flex; align-items:center; gap:.4rem; cursor:pointer;">
                    <input type="checkbox" name="remember" checked style="accent-color:var(--first-color);"> Remember Me
                </label>
                <a href="#" onclick="alert('Please contact system administrator to reset password.'); return false;" style="color:var(--first-color); text-decoration:none;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn-login">Sign In &rarr;</button>
        </form>

        <div class="login-footer-links">
            <a href="{{ url_for('story_home') }}">&larr; Return to Storefront</a>
            <a href="{{ url_for('home') }}">Main Website</a>
        </div>
    </div>

</body>
</html>
